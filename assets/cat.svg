<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Cat Body -->
  <ellipse cx="32" cy="42" rx="18" ry="14" fill="#FFA94D" />
  <!-- Belly -->
  <ellipse cx="32" cy="44" rx="12" ry="9" fill="#FFE8CC" />
  <!-- Cat Head -->
  <circle cx="32" cy="24" r="14" fill="#FFA94D" />
  <!-- Cat Ears -->
  <polygon points="20,18 24,6 30,16" fill="#FFA94D" />
  <polygon points="22,16 25,8 29,15" fill="#FFC9C9" />
  <polygon points="44,18 40,6 34,16" fill="#FFA94D" />
  <polygon points="42,16 39,8 35,15" fill="#FFC9C9" />
  <!-- Eyes -->
  <ellipse cx="26" cy="22" rx="2.5" ry="3.5" fill="#2B2D42" />
  <ellipse cx="38" cy="22" rx="2.5" ry="3.5" fill="#2B2D42" />
  <circle cx="27" cy="21" r="1" fill="#FFFFFF" />
  <circle cx="39" cy="21" r="1" fill="#FFFFFF" />
  <!-- Nose & Mouth -->
  <polygon points="30,26 34,26 32,28" fill="#FF8787" />
  <path d="M 29 29 Q 32 32 35 29" fill="none" stroke="#2B2D42" stroke-width="1.5" stroke-linecap="round" />
  <!-- Cheeks -->
  <circle cx="21" cy="26" r="2.5" fill="#FFA8A8" opacity="0.6" />
  <circle cx="43" cy="26" r="2.5" fill="#FFA8A8" opacity="0.6" />
  <!-- Paws -->
  <ellipse cx="20" cy="54" rx="5" ry="4" fill="#FFA94D" />
  <ellipse cx="44" cy="54" rx="5" ry="4" fill="#FFA94D" />
  <ellipse cx="28" cy="54" rx="4" ry="3.5" fill="#FFE8CC" />
  <ellipse cx="36" cy="54" rx="4" ry="3.5" fill="#FFE8CC" />
  <!-- Tail -->
  <path d="M 48 44 Q 58 40 56 30" fill="none" stroke="#FFA94D" stroke-width="5" stroke-linecap="round" />
</svg>
